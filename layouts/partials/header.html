<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }} ホーム">
      <span class="brand__mark" aria-hidden="true">∑</span>
      <span>
        <strong>{{ .Site.Title }}</strong>
        {{ with .Site.Params.tagline }}<small>{{ . }}</small>{{ end }}
      </span>
    </a>
    <nav class="site-nav" aria-label="メインナビゲーション">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ with .Site.Params.repository }}<a class="site-nav__repo" href="{{ . }}">Repository ↗</a>{{ end }}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替える" aria-pressed="false">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 15.7A8.5 8.5 0 0 1 8.3 3.8 8.5 8.5 0 1 0 20.2 15.7Z"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
