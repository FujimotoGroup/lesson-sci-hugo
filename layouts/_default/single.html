{{ define "main" }}
  <article class="article">
    <header class="article-header">
      <p class="eyebrow">{{ .Section | default "Guide" }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="lead">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
