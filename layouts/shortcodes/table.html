{{- $number := add (default 0 (.Page.Scratch.Get "tableCounter")) 1 -}}
{{- .Page.Scratch.Set "tableCounter" $number -}}
{{- $id := default (printf "table-%d" $number) (.Get "id") | anchorize -}}
{{- $label := printf "表%d" $number -}}
{{- .Page.Scratch.SetInMap "crossReferenceLabels" $id $label -}}
<figure id="{{ $id }}" class="numbered-content numbered-table" data-reference-label="{{ $label }}">
  <figcaption class="numbered-content__caption">
    <span class="numbered-content__label">{{ $label }}</span>
    {{- with .Get "caption" }}<span>{{ . }}</span>{{ end -}}
  </figcaption>
  <div class="numbered-table__scroll">
    {{- .Inner | markdownify -}}
  </div>
</figure>
