{{ define "main" }}
  <section class="section-intro">
    <p class="eyebrow">{{ i18n "learningPath" }}</p>
    <h1>{{ .Title }}</h1>
    <div class="lead prose">{{ .Content }}</div>
  </section>
  {{- $root := .Site.GetPage "section" "lessons" -}}
  {{- $pages := partial "lessons/pages.html" $root -}}
  <ol class="course-list">
    {{- partial "lessons/course-tree.html" (dict "Section" . "Pages" $pages) -}}
  </ol>
{{ end }}
